{% extends "loged.html" %}

{% block content %}
    <h1 class="text-2xl/8 font-semibold text-zinc-950 sm:text-xl/8 dark:text-white">Twoje klucze API</h1>
    <div class="flow-root">
        <div class="mt-4 [--gutter:--spacing(6)] lg:[--gutter:--spacing(10)] -mx-(--gutter) overflow-x-auto whitespace-nowrap">
            <div class="inline-block min-w-full align-middle sm:px-(--gutter)">
                <table class="min-w-full text-left text-sm/6 text-zinc-950 dark:text-white">
                    <thead class="text-zinc-500 dark:text-zinc-400">
                        <tr>
                            <th></th>
                            <th>Nazwa</th>
                            <th>Data utworzenia</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in api_list %}
                            <tr>
                                <td></td>
                                <td>{{ item.name }}</td>
                                <td>{{ item.created_at }}</td>
                                <td></td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
{% endblock %}
